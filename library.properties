name=bsec3
version=3.3.0.0
author=Bosch Sensortec
maintainer=Bosch Sensortec <contact@bosch-sensortec.com>
sentence=Bosch Sensortec Environmental Cluster (BSEC) v3 Software library
paragraph=for use with the BME688 and BME690 sensors. It provides higher-level signal processing and fusion: the library receives compensated sensor values from the BME6xx sensor API and processes the signals to provide the requested virtual sensor outputs (IAQ, CO2 equivalent, bVOC, gas percentage, compensated gas, etc.). Define BSEC3_BME690 to target the BME690; the default target is the BME688.
category=Sensors
url=https://www.bosch-sensortec.com/software-tools/software/bme688-software/
architectures=samd,sam,esp8266,esp32,esp32s2,esp32s3,esp32c3,mbed,nrf52
includes=bsec3.h
precompiled=true
ldflags=-lalgobsec
depends=BME68x Sensor library,BME69x Sensor library
